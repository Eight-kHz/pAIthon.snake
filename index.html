<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>pAIthon | Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    canvas {
      background: #111;
      border: 4px solid #333;
      border-radius: 0px;
    }
    #score-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0.5rem 0;
    }
    .score, .record {
      margin: 0 1rem;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: #ccc;
    }

    .control-button {
      background: #444;
      color: #fff;
      font-size: 1.4rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 0.2rem 0;
      margin: 2.5px 0;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    
    .control-button:hover {
      background: #666;
    }
    
    .full-width {
      width: 100%;
      max-width: 350px;
    }
    
    .half-width {
      width: 49.5%;
    }
    
    /* Контейнер для кнопок */
    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0.3rem;
      width: 100%;
      max-width: 350px;
    }
    
    #controls .row {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    
         #popup-message {
         top: 40%;
         transform: translate(-50%, -60%);
         background: rgba(0, 0, 0, 0.8);
         color: #fff;
         padding: 1rem 2rem;
         font-size: 1.2rem;
         transition: 0.3s ease;
         position: fixed;
         left: 50%;
         transform: translateX(-50%);
         border-radius: 20px;
         text-align: center;
         z-index: 999;
         pointer-events: none;
         }
    
    .share-button {
      width: 100%;
      max-width: 350px;
      height: 35px;
      padding: 0.5rem 1rem;
      background: #444;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
      margin-top: 0.3rem;
    }
    .share-button:hover {
      background-color: #666;
    }
    #over-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 1.5rem;
      padding: 1rem 2rem;
      border-radius: 20px;
      display: none;
      z-index: 10;
      text-align: center;
    }

  </style>
</head>
<body>
  <h1><a href="https://t.me/pAIthon_ChatBot?start=snake" target="_blank" style="color:inherit;text-decoration:none;">Snake [pAIthon]</a></h1>
  <div id="score-container">
    <div class="score">Счёт<br><span id="score">0</span></div>
    <div class="record">Рекорд<br><span id="record">0</span></div>
  </div>
  <div id="popup-message" style="display:none;" role="alert"></div>
  <canvas id="game" width="320" height="320"></canvas>
  <div id="controls">
  <button onclick="move('up')" class="control-button full-width">⬆️</button>
  <div class="row">
    <button onclick="move('left')" class="control-button half-width">⬅️</button>
    <button onclick="move('right')" class="control-button half-width">➡️</button>
  </div>
  <button onclick="move('down')" class="control-button full-width">⬇️</button>
</div>
  <button onclick="sendScoreToBot()" class="share-button">🔗 Сохранить рекорд</button>
  <div id="over-overlay" onclick="init()">Игра окончена</div>
  
  <script src="https://telegram.org/js/games.js"></script>
  <script>
    let mouseStartX, mouseStartY, isDragging = false;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let user = 'None', m_id = 'None';
    let nextDirection = 'RIGHT';
    let score = 0, record = 0;
    let direction = 'RIGHT';
    let fruitGrowing = true;
    const minSwipeDist = 30;
    const canvasSize = 320;
    let fruitScale = 1;
    const box = 20;
    let snake = [];
    let gameLoop;
    
   function getParamsFromURL() {
     try {
       const encoded = new URLSearchParams(window.location.search).get('r');
       if (!encoded) throw new Error("No data in URL");
       const {u, m, r
       } = JSON.parse(atob(encoded));
       user = u ?? user;
       m_id = m ?? m_id;
       record = r ?? record;
     } catch (e) {
       console.warn("URL data missing or invalid:", e.message);
     }
     return {user, m_id, record, payload: { type: "snake", score: record, user, m_id }};
   }
    
function drawSnakeSegment(x, y, index, isHead = false) {
  const centerX = x + box / 2;
  const centerY = y + box / 2;
  if (isHead) {
    ctx.save();
    ctx.translate(centerX, centerY);
    const angles = {
      UP: 0,
      RIGHT: Math.PI / 2,
      DOWN: Math.PI,
      LEFT: -Math.PI / 2
    };
    ctx.rotate(angles[direction] || 0);
    const gradient = ctx.createRadialGradient(0, 0, 4, 0, 0, box / 2);
    gradient.addColorStop(0, '#4caf50');
    gradient.addColorStop(1, '#1b5e20');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(-box / 2, -box / 2, box, box, 6);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-box * 0.25, -box * 0.2, 3, 0, 2 * Math.PI);
    ctx.arc( box * 0.25, -box * 0.2, 3, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(-box * 0.25, -box * 0.2, 1.5, 0, 2 * Math.PI);
    ctx.arc( box * 0.25, -box * 0.2, 1.5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.restore();
  } else {
    let prev = snake[index - 1];
    let next = snake[index + 1];
    if (!next && prev) {
      const dx = x - prev.x;
      const dy = y - prev.y;
      next = { x: x + dx, y: y + dy };
    }
    if (!prev && next) {
      const dx = next.x - x;
      const dy = next.y - y;
      prev = { x: x - dx, y: y - dy };
    }
    const isHorizontal = prev.y === next.y;
    let gradient;
    if (isHorizontal) {
      gradient = ctx.createLinearGradient(x, y, x, y + box); 
    } else {
      gradient = ctx.createLinearGradient(x, y, x + box, y); 
    }
    gradient.addColorStop(0, '#388e3c');
    gradient.addColorStop(0.5, '#66bb6a');
    gradient.addColorStop(1, '#2e7d32');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(x, y, box, box, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.beginPath();
    ctx.arc(centerX, centerY, box * 0.2, 0, 2 * Math.PI);
    ctx.stroke();
  }
}

    const fruitTypes = [
      { emoji: '🍎', color: '#e74c3c' },
      { emoji: '🍌', color: '#f1c40f' },
      { emoji: '🍇', color: '#8e44ad' },
      { emoji: '🍓', color: '#c0392b' },
      { emoji: '🥝', color: '#27ae60' },
      { emoji: '🍊', color: '#f39c12' }
    ];
    let fruit = { x: 0, y: 0, type: fruitTypes[0] };
    
    function placefruit() {
      let validPosition = false;
      while (!validPosition) {
        const x = Math.floor(Math.random() * (canvasSize / box)) * box;
        const y = Math.floor(Math.random() * (canvasSize / box)) * box;
        const conflict = snake.some(seg => seg.x === x && seg.y === y);
        if (!conflict) {
          fruit.x = x;
          fruit.y = y;
          fruit.type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
          validPosition = true;
        }
      }
    }

    function init() {
      clearInterval(gameLoop);
      score = 0;
      snake = [
        { x: 5 * box, y: 5 * box },
        { x: 4 * box, y: 5 * box },
        { x: 3 * box, y: 5 * box },
        { x: 2 * box, y: 5 * box }
      ];
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      fruitScale = 1;
      fruitGrowing = true;
      ctx.textAlign = 'center'; 
      ctx.textBaseline = 'middle';
      document.getElementById('score').textContent = score;
      const scoreElement = document.getElementById('score');
       const recordElement = document.getElementById('record');
       if (score > record) {
         record = score;
       }
       scoreElement.textContent = score;
       recordElement.textContent = record;
      document.getElementById('record').textContent = record;
      document.getElementById('over-overlay').style.display = 'none';
      placefruit();
      gameLoop = setInterval(drawGame, 200);
    }

    function drawGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  direction = nextDirection;
  ctx.font = `${box}px sans-serif`;
  // Анимация пульсации
  if (fruitGrowing) {
    fruitScale += 0.1;
    if (fruitScale >= 1.1) fruitGrowing = false;
  } else {
    fruitScale -= 0.1;
    if (fruitScale <= 0.8) fruitGrowing = true;
  }
  ctx.save();
  ctx.translate(fruit.x + box / 2, fruit.y + box / 2);
  ctx.scale(fruitScale, fruitScale);
  ctx.fillText(fruit.type.emoji, 0, 0);
  ctx.restore();
  for (let i = 0; i < snake.length; i++) {
    drawSnakeSegment(snake[i].x, snake[i].y, i, i === 0);
  }
  let headX = snake[0].x;
  let headY = snake[0].y;
  if (direction === 'LEFT') headX -= box;
  if (direction === 'UP') headY -= box;
  if (direction === 'RIGHT') headX += box;
  if (direction === 'DOWN') headY += box;
  if (headX === fruit.x && headY === fruit.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > record) {
      record = score;
      document.getElementById('record').textContent = record;
    }
    placefruit();
  } else {
    snake.pop();
  }

  const newHead = { x: headX, y: headY };
  // Game over
  if (
    headX < 0 || headX >= canvasSize || headY < 0 || headY >= canvasSize ||
    snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)
  ) {
    if (score > record) {
      record = score;
    }
    sendScoreToBot();
    clearInterval(gameLoop);
    document.getElementById('over-overlay').style.display = 'block';
    const scoreElement = document.getElementById('score');
    const recordElement = document.getElementById('record');
    scoreElement.textContent = score;
    recordElement.textContent = record;
    return;
  }
  snake.unshift(newHead);
}

  function move(dir) {
    const opposites = { LEFT: 'RIGHT', RIGHT: 'LEFT', UP: 'DOWN', DOWN: 'UP' };
    const dirUpper = dir.toUpperCase();
    if (dirUpper !== opposites[direction]) {
      nextDirection = dirUpper;
    }
  }

  window.addEventListener('keydown', e => {
    const key = e.key;
    const wasd = key.toLowerCase();
    const keys = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down',
      a: 'left',
      d: 'right',
      w: 'up',
      s: 'down',
      ф: 'left',
      в: 'right',
      ц: 'up',
      ы: 'down'
    };
    if (keys[key]) {
      move(keys[key]);
    } else if (keys[wasd]) {
      move(keys[wasd]);
    }
  });

  window.addEventListener('mousedown', e => {
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    isDragging = false;
  });

  window.addEventListener('mousemove', e => {
    if (isDragging) return;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    if (Math.abs(dx) > minSwipeDist || Math.abs(dy) > minSwipeDist) {
      isDragging = true;
    }
  });

  window.addEventListener('mouseup', e => {
    if (!isDragging) return;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    if (Math.abs(dx) < minSwipeDist && Math.abs(dy) < minSwipeDist) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
    isDragging = false;
  });

   function sendScoreToBot() {
      if (m_id === 'None' || user === 'None') {
        showPopup("⚠️ Рекорд не сохранён.<br>Зайди из Телеграм!");
        return;
      }
      const payload = { type: "snake", score: record, user, m_id };
      fetch('https://mygame2048.loca.lt/game_score', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload),
        mode: 'cors',
      })
      .then(response => response.json())
      .then(data => {
        console.log("Server response:", data);
        showPopup(data.success ? "✅ Рекорд сохранён!" : "❌ Ошибка при сохранении.");
      });
    }
   
   function showPopup(message) {
     const popup = document.getElementById('popup-message');
     popup.innerHTML = message;
     popup.style.display = 'flex';
     popup.style.opacity = '0';
     popup.style.transform = 'translate(-50%, -60%)';
     setTimeout(() => {
       popup.style.opacity = '1';
       popup.style.transform = 'translate(-50%, -50%)';
     }, 10);
     setTimeout(() => {
       popup.style.opacity = '0';
       popup.style.transform = 'translate(-50%, -60%)';
       setTimeout(() => {
         popup.style.display = 'none';
       }, 300);
     }, 2500);
   }
    
    window.addEventListener('load', () => {
     const urlData = getParamsFromURL();
     user = urlData.user;
     m_id = urlData.m_id;
     record = urlData.record;
     payload = urlData.payload;
     init();
     if (record > 0) {
       document.getElementById('record').textContent = record;
     }
     console.log(`User login:\ntype: '${payload.type}'\nuser: '${payload.user}'\nm_id: '${payload.m_id}'`);})
      
  </script>
</body>
</html>
