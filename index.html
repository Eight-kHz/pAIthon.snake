<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>pAIthon | Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    canvas {
      background: #111;
      border: 4px solid #333;
      border-radius: 0px;
    }
    #score-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0.5rem 0;
    }
    .score, .record {
      margin: 0 1rem;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: #ccc;
    }
    .restart-button, .share-button {
      width: 100%;
      max-width: 350px;
      height: 45px;
      padding: 0.5rem 1rem;
      background: #444;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
      margin-top: 1rem;
    }
    .restart-button:hover, .share-button:hover {
      background-color: #666;
    }
    .restart-icon {
      width: 28px;
      height: 28px;
      fill: white;
      display: block;
      transform: scaleX(-1);
    }
    #over-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 1.5rem;
      padding: 1rem 2rem;
      border-radius: 20px;
      display: none;
      z-index: 10;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1><a href="https://t.me/pAIthon_ChatBot?start=snake" target="_blank" style="color:inherit;text-decoration:none;">Snake [pAIthon]</a></h1>
  <div id="score-container">
    <div class="score">Счёт<br><span id="score">0</span></div>
    <div class="record">Рекорд<br><span id="record">0</span></div>
  </div>
  <canvas id="game" width="320" height="320"></canvas>
  <button onclick="init()" class="restart-button">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="restart-icon">
      <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
    </svg>
  </button>
  <button onclick="sendScoreToBot()" class="share-button">🔗 Сохранить рекорд</button>
  <div id="over-overlay">Игра окончена</div>

  <script src="https://telegram.org/js/games.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const box = 20;
    const canvasSize = 320;
    let snake = [];
    let direction = 'RIGHT';
    let score = 0;
    let record = 0;
    let gameLoop;
    let nextDirection = 'RIGHT';
    let fruitScale = 1;
    let fruitGrowing = true;
    
  function drawSnakeSegment(x, y, index, isHead = false) {
  if (isHead) {
    ctx.save();

    // Центр головы
    const centerX = x + box / 2;
    const centerY = y + box / 2;

    // Сдвигаем и поворачиваем канвас в зависимости от направления
    ctx.translate(centerX, centerY);

    const angles = {
      UP: 0,
      RIGHT: Math.PI / 2,
      DOWN: Math.PI,
      LEFT: -Math.PI / 2
    };
    ctx.rotate(angles[direction] || 0);

    // Рисуем голову (всегда вверх, т.к. канвас уже повернут)
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(-box / 2, -box / 2, box, box);

    // Глаза — по Y вверх от центра
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-box * 0.25, -box * 0.2, 2.5, 0, 2 * Math.PI);
    ctx.arc( box * 0.25, -box * 0.2, 2.5, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(-box * 0.25, -box * 0.2, 1, 0, 2 * Math.PI);
    ctx.arc( box * 0.25, -box * 0.2, 1, 0, 2 * Math.PI);
    ctx.fill();

    ctx.restore();
  } else {
    const greenValue = 200 - (index * 8);
    ctx.fillStyle = `rgb(0, ${greenValue}, 0)`;
    ctx.fillRect(x, y, box, box);
  }
}

    const fruitTypes = [
      { emoji: '🍎', color: '#e74c3c' },
      { emoji: '🍌', color: '#f1c40f' },
      { emoji: '🍇', color: '#8e44ad' },
      { emoji: '🍓', color: '#c0392b' },
      { emoji: '🥝', color: '#27ae60' },
      { emoji: '🍊', color: '#f39c12' }
    ];
    let fruit = { x: 0, y: 0, type: fruitTypes[0] };
    
    function placefruit() {
      let validPosition = false;
      while (!validPosition) {
        const x = Math.floor(Math.random() * (canvasSize / box)) * box;
        const y = Math.floor(Math.random() * (canvasSize / box)) * box;
        const conflict = snake.some(seg => seg.x === x && seg.y === y);
        if (!conflict) {
          fruit.x = x;
          fruit.y = y;
          fruit.type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
          validPosition = true;
        }
      }
    }

    function init() {
      clearInterval(gameLoop);
      snake = [{ x: 5 * box, y: 5 * box }];
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      score = 0;
      fruitScale = 1; // Заменено с foodScale
      fruitGrowing = true; // Заменено с foodGrowing
      document.getElementById('score').textContent = score;
      record = 0;
      document.getElementById('record').textContent = record;
      document.getElementById('over-overlay').style.display = 'none';
      placefruit();
      gameLoop = setInterval(drawGame, 150);
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      direction = nextDirection;
      
      // Отрисовка фрукта (используем эмоджи)
      ctx.font = `${box}px sans-serif`; // Устанавливаем размер шрифта
      ctx.textAlign = 'center'; // Выравнивание текста по центру
      ctx.textBaseline = 'middle'; // Выравнивание текста по вертикали
    
      // Отображение эмодзи фрукта
      ctx.fillText(fruit.type.emoji, fruit.x + box / 2, fruit.y + box / 2);
    
      // Отрисовка змейки
      for (let i = 0; i < snake.length; i++) {
        drawSnakeSegment(snake[i].x, snake[i].y, i, i === 0);
      }
    
      let headX = snake[0].x;
      let headY = snake[0].y;
    
      if (direction === 'LEFT') headX -= box;
      if (direction === 'UP') headY -= box;
      if (direction === 'RIGHT') headX += box;
      if (direction === 'DOWN') headY += box;
    
      if (headX === fruit.x && headY === fruit.y) {
        score++;
        document.getElementById('score').textContent = score;
        placefruit();
      } else {
        snake.pop();
      }
    
      const newHead = { x: headX, y: headY };
    
      // Game over
      if (
        headX < 0 || headX >= canvasSize || headY < 0 || headY >= canvasSize ||
        snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)
      ) {
        clearInterval(gameLoop);
        document.getElementById('over-overlay').style.display = 'block';
        if (score > record) {
          record = score;
          localStorage.setItem('snakeRecord', record);
          document.getElementById('record').textContent = record;
        }
        return;
      }
      snake.unshift(newHead);
    
      // Управление изменением размера фрукта
      if (fruitGrowing) {
        fruitScale += 0.05;
        if (fruitScale >= 1.2) fruitGrowing = false;
      } else {
        fruitScale -= 0.05;
        if (fruitScale <= 0.8) fruitGrowing = true;
      }
    }


    let touchStartX, touchStartY;
  let mouseStartX, mouseStartY, isDragging = false;
  const minSwipeDist = 30;

  function move(dir) {
    const opposites = { LEFT: 'RIGHT', RIGHT: 'LEFT', UP: 'DOWN', DOWN: 'UP' };
    const dirUpper = dir.toUpperCase();
    if (dirUpper !== opposites[direction]) {
      nextDirection = dirUpper;
    }
  }

  window.addEventListener('keydown', e => {
    const key = e.key;
    const wasd = key.toLowerCase();
    const keys = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down',
      a: 'left',
      d: 'right',
      w: 'up',
      s: 'down',
      ф: 'left',
      в: 'right',
      ц: 'up',
      ы: 'down'
    };
    if (keys[key]) {
      move(keys[key]);
    } else if (keys[wasd]) {
      move(keys[wasd]);
    }
  });

  window.addEventListener('touchstart', e => {
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  });

  window.addEventListener('touchend', e => {
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (Math.abs(dx) < minSwipeDist && Math.abs(dy) < minSwipeDist) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  window.addEventListener('mousedown', e => {
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    isDragging = false;
  });

  window.addEventListener('mousemove', e => {
    if (isDragging) return;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    if (Math.abs(dx) > minSwipeDist || Math.abs(dy) > minSwipeDist) {
      isDragging = true;
    }
  });

  window.addEventListener('mouseup', e => {
    if (!isDragging) return;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    if (Math.abs(dx) < minSwipeDist && Math.abs(dy) < minSwipeDist) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
    isDragging = false;
  });

    function sendScoreToBot() {
      if (typeof TelegramGameProxy !== 'undefined') {
        TelegramGameProxy.postEvent('score', score);
      } else if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) {
        fetch('/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            score: score,
            initData: Telegram.WebApp.initData
          })
        });
      } else {
        alert('Telegram WebApp не инициализирован');
      }
    }
    init();
  </script>
</body>
</html>
